<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NEBU Fit30 - Plan Nutricional</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="navbar.css">
</head>
<body>

    <div id="appSection">
        <nav class="navbar navbar-expand-lg border-bottom app-navbar" id="mainNavbar">
            <div class="container app-navbar-inner">
                <a class="navbar-brand d-flex align-items-center gap-2 app-navbar-brand" href="#">
                    <i class="bi bi-heart-pulse-fill text-success fs-3"></i>
                    <span class="fw-bold">NEBU Fit30</span>
                </a>
                <div class="d-flex align-items-center gap-2 app-navbar-actions">
                    <a href="mercado.html" class="btn btn-success btn-sm rounded-pill px-3 fw-semibold shadow-sm app-navbar-link"><i class="bi bi-cart-check me-1"></i> Lista de Mercado</a>
                    <button class="btn btn-outline-secondary rounded-circle d-flex align-items-center justify-content-center app-navbar-theme" id="themeToggle" type="button" style="width: 40px; height: 40px;">
                        <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
                    </button>
                </div>
            </div>
        </nav>

        <div class="container mt-4">
            <!-- Selector de Días -->
            <div class="mb-4">
                <label class="form-label fw-bold text-secondary mb-2"><i class="bi bi-calendar3 me-1"></i> Selecciona el Día del Plan:</label>
                <div class="day-selector-container" id="daySelector"></div>
            </div>

            <!-- Panel Nutricional -->
            <div class="row g-3 mb-4">
                <div class="col-lg-4 col-md-5">
                    <div class="macro-card text-center h-100 d-flex flex-column justify-content-center py-4">
                        <h6 class="text-muted mb-2 fw-semibold">Total Calorías Consumidas</h6>
                        <div style="max-width: 150px; margin: 0 auto;"><canvas id="caloriesChart"></canvas></div>
                        <h3 class="mt-3 fw-bold mb-0 text-success" id="totalCalories">0 kcal</h3>
                    </div>
                </div>
                <div class="col-lg-8 col-md-7">
                    <div class="macro-card h-100 d-flex flex-column justify-content-between p-4">
                        <div>
                            <h6 class="text-muted mb-3 fw-semibold">Desglose de Macronutrientes</h6>
                            <div class="row g-2 text-center">
                                <div class="col-3"><div class="p-2 border rounded macro-box"><small class="text-muted d-block">Proteínas</small><strong class="text-success fs-5" id="totalProtein">0g</strong></div></div>
                                <div class="col-3"><div class="p-2 border rounded macro-box"><small class="text-muted d-block">Carbos</small><strong class="text-primary fs-5" id="totalCarbs">0g</strong></div></div>
                                <div class="col-3"><div class="p-2 border rounded macro-box"><small class="text-muted d-block">Grasas</small><strong class="text-warning fs-5" id="totalFats">0g</strong></div></div>
                                <div class="col-3"><div class="p-2 border rounded macro-box"><small class="text-muted d-block">Azúcares</small><strong class="text-danger fs-5" id="totalSugars">0g</strong></div></div>
                            </div>
                        </div>
                        <div class="mt-3">
                            <div class="d-flex justify-content-between mb-1"><small class="fw-semibold">Cumplimiento del Día</small><small id="progressText" class="fw-bold">0%</small></div>
                            <div class="progress" style="height: 10px; border-radius: 5px;"><div id="progressBar" class="progress-bar bg-success" role="progressbar" style="width: 0%"></div></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold mb-0 text-secondary" id="selectedDayTitle">Comidas del Día 1</h5>
                <button class="btn btn-sm btn-outline-secondary rounded-pill px-3" onclick="resetDayCheckboxes()"><i class="bi bi-arrow-counterclockwise me-1"></i> Reiniciar Mis Marcas</button>
            </div>
            
            <div class="accordion meal-accordion" id="mealsAccordion"></div>
        </div>
    </div>

    <!-- Modal Editar Comida -->
    <div class="modal fade" id="editMealModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold text-success"><i class="bi bi-pencil-square me-1"></i> Editar Comida</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editMealId">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Nombre del Plato</label>
                        <input type="text" class="form-control" id="editName">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Horario</label>
                        <input type="text" class="form-control" id="editTime">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Ingredientes (un ingrediente por línea)</label>
                        <textarea class="form-control" id="editIngredients" rows="3"></textarea>
                        <button type="button" class="btn btn-outline-primary btn-sm mt-2 w-100 fw-semibold" id="btnAutoCalc" onclick="autoCalculateMacros()">
                            <i class="bi bi-magic me-1"></i> Calcular Macros Automáticamente con IA (Groq)
                        </button>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Preparación</label>
                        <textarea class="form-control" id="editPrep" rows="3"></textarea>
                    </div>
                    <div class="row g-2">
                        <div class="col-4"><label class="form-label small fw-bold">Calorías</label><input type="number" class="form-control" id="editCals"></div>
                        <div class="col-4"><label class="form-label small fw-bold">Proteína (g)</label><input type="number" class="form-control" id="editProt"></div>
                        <div class="col-4"><label class="form-label small fw-bold">Carbos (g)</label><input type="number" class="form-control" id="editCarbs"></div>
                        <div class="col-6 mt-2"><label class="form-label small fw-bold">Grasas (g)</label><input type="number" class="form-control" id="editFats"></div>
                        <div class="col-6 mt-2"><label class="form-label small fw-bold">Azúcares (g)</label><input type="number" class="form-control" id="editSugars"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-success rounded-pill px-4" onclick="saveMealChanges()">Guardar Cambios</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
