<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NEBU Plan 31</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Top Navigation -->
    <nav class="navbar navbar-expand-lg border-bottom sticky-top" id="mainNavbar">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                <i class="bi bi-heart-pulse-fill text-success fs-4"></i>
                <span>FitPlan 31</span>
            </a>
            
            <div class="d-flex align-items-center gap-2">
                <span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill d-none d-sm-inline-block">
                    Plan Nutricional 31 Días
                </span>
                <!-- Botón Modo Nocturno / Diurno -->
                <button class="btn btn-outline-secondary rounded-circle d-flex align-items-center justify-content-center" 
                        id="themeToggle" 
                        type="button" 
                        aria-label="Cambiar tema"
                        style="width: 40px; height: 40px;">
                    <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">

        <!-- Selector de Días -->
        <div class="mb-3">
            <label class="form-label fw-bold text-secondary mb-2">
                <i class="bi bi-calendar3 me-1"></i> Selecciona el Día del Plan:
            </label>
            <div class="day-selector-container" id="daySelector">
                <!-- Generado dinámicamente con JS -->
            </div>
        </div>

        <!-- Panel Nutricional (Macros Dashboard) -->
        <div class="row g-3 mb-4">
            <div class="col-lg-4 col-md-5">
                <div class="macro-card text-center h-100 d-flex flex-column justify-content-center">
                    <h6 class="text-muted mb-2">Total Calorías Consumidas</h6>
                    <div style="max-width: 160px; margin: 0 auto;">
                        <canvas id="caloriesChart"></canvas>
                    </div>
                    <h3 class="mt-2 fw-bold" id="totalCalories">0 kcal</h3>
                </div>
            </div>
            <div class="col-lg-8 col-md-7">
                <div class="macro-card h-100">
                    <h6 class="text-muted mb-3">Desglose de Macronutrientes</h6>
                    <div class="row g-3 text-center">
                        <div class="col-3">
                            <div class="p-2 border rounded macro-box">
                                <small class="text-muted d-block">Proteínas</small>
                                <strong class="text-success fs-5" id="totalProtein">0g</strong>
                            </div>
                        </div>
                        <div class="col-3">
                            <div class="p-2 border rounded macro-box">
                                <small class="text-muted d-block">Carbos</small>
                                <strong class="text-primary fs-5" id="totalCarbs">0g</strong>
                            </div>
                        </div>
                        <div class="col-3">
                            <div class="p-2 border rounded macro-box">
                                <small class="text-muted d-block">Grasas</small>
                                <strong class="text-warning fs-5" id="totalFats">0g</strong>
                            </div>
                        </div>
                        <div class="col-3">
                            <div class="p-2 border rounded macro-box">
                                <small class="text-muted d-block">Azúcares</small>
                                <strong class="text-danger fs-5" id="totalSugars">0g</strong>
                            </div>
                        </div>
                    </div>

                    <div class="mt-4">
                        <div class="d-flex justify-content-between mb-1">
                            <small class="fw-semibold">Cumplimiento del Día</small>
                            <small id="progressText">0%</small>
                        </div>
                        <div class="progress" style="height: 10px;">
                            <div id="progressBar" class="progress-bar bg-success" role="progressbar" style="width: 0%">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Contenedor de Comidas (Acordeones) -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0" id="selectedDayTitle">Comidas del Día 1</h5>
            <button class="btn btn-sm btn-outline-secondary" onclick="resetDayCheckboxes()">
                <i class="bi bi-arrow-counterclockwise"></i> Reiniciar Marcas
            </button>
        </div>

        <div class="accordion meal-accordion" id="mealsAccordion">
            <!-- Generado dinámicamente con JS -->
        </div>

    </div>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JS Principal con la lógica y la base de datos completa -->
    <script src="script.js"></script>
    <!-- JS Opcional para auto-seleccionar el día actual del mes -->
    <script src="auto-day.js"></script>

</body>

</html>
