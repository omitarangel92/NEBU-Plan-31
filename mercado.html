<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NEBU - Lista de Mercado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="mercado.css">
    <link rel="stylesheet" href="navbar.css">
</head>

<body>

    <!-- Navegación -->
    <nav class="navbar navbar-expand-lg border-bottom app-navbar">
        <div class="container app-navbar-inner">
            <a class="navbar-brand d-flex align-items-center gap-2 app-navbar-brand" href="index.html">
                <i class="bi bi-cart-check-fill fs-3"></i>
                <span class="fs-5">NEBU Mercado</span>
            </a>
            <div class="d-flex align-items-center gap-2 app-navbar-actions">
                <a href="index.html" class="btn btn-success btn-sm rounded-pill px-3 fw-semibold shadow-sm app-navbar-link"
                    aria-label="Plan Nutricional" title="Plan Nutricional"><i class="bi bi-calendar3 me-1"
                        aria-hidden="true"></i> Plan Nutricional</a>
                <button
                    class="btn btn-outline-secondary rounded-circle d-flex align-items-center justify-content-center app-navbar-theme"
                    id="themeToggle" type="button" style="width: 40px; height: 40px;">
                    <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">

        <!-- Resumen Financiero General -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card p-3 text-center bg-success-subtle text-success border-0 shadow-sm">
                    <small class="fw-semibold text-uppercase opacity-75">Presupuesto General</small>
                    <h3 class="fw-bold mb-0 my-1" id="genBudget">$400.000</h3>
                    <button class="btn btn-link text-success btn-sm p-0 text-decoration-none fw-semibold"
                        onclick="changeGeneralBudget()"><i class="bi bi-pencil-square"></i> Cambiar Presupuesto</button>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3 text-center bg-primary-subtle text-primary border-0 shadow-sm">
                    <small class="fw-semibold text-uppercase opacity-75">Total Gastado</small>
                    <h3 class="fw-bold mb-0 my-1" id="genTotal">$0</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3 text-center bg-warning-subtle text-warning-emphasis border-0 shadow-sm">
                    <small class="fw-semibold text-uppercase opacity-75">Restante / Saldo</small>
                    <h3 class="fw-bold mb-0 my-1" id="genRemaining">$0</h3>
                </div>
            </div>
        </div>

        <!-- Filtros y Buscador -->
        <div class="card p-3 mb-4">
            <div class="row g-3 align-items-center">
                <div class="col-lg-6 col-md-12">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control" id="searchConcept"
                            placeholder="Buscar por concepto o producto..." oninput="filterGeneralTable()">
                    </div>
                </div>
                <div class="col-lg-3 col-md-6">
                    <select class="form-select" id="filterStatus" onchange="filterGeneralTable()">
                        <option value="">Estado: Todos</option>
                        <option value="NO">NO (No se necesita)</option>
                        <option value="SI">SI (Se debe comprar)</option>
                        <option value="YA">YA (Ya se compro)</option>
                    </select>
                </div>
                <div class="col-lg-3 col-md-6">
                    <select class="form-select" id="filterArea" onchange="filterGeneralTable()">
                        <option value="">Área: Todas</option>
                        <option value="Aseo Casita">Aseo Casita</option>
                        <option value="Aseo Cocina">Aseo Cocina</option>
                        <option value="Aseo Personal">Aseo Personal</option>
                        <option value="Baño">Baño</option>
                        <option value="Lavandería">Lavandería</option>
                        <option value="Proteina">Proteina</option>
                        <option value="Salsas">Salsas</option>
                        <option value="Granos">Granos</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
            <h5 class="fw-bold mb-0 text-secondary" id="itemCountTitle"><i
                    class="bi bi-list-columns-reverse me-2"></i>Lista Completa</h5>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-secondary fw-semibold px-3 rounded-pill" onclick="restoreFullList()"><i
                        class="bi bi-arrow-counterclockwise me-1"></i> Recargar 145+ Ítems</button>
                <button class="btn btn-success fw-semibold px-4 rounded-pill shadow-sm"
                    onclick="openAddGeneralModal()"><i class="bi bi-plus-lg me-1"></i> Agregar Producto</button>
            </div>
        </div>

        <div class="card overflow-hidden">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th style="width: 120px;" class="ps-3">ESTADO</th>
                                <th>CONCEPTO</th>
                                <th>ÁREA</th>
                                <th class="text-end">P.U ($)</th>
                                <th class="text-center">CANT.</th>
                                <th class="text-end">TOTAL ($)</th>
                                <th class="text-center pe-3" style="width: 100px;">ACCIONES</th>
                            </tr>
                        </thead>
                        <tbody id="tableGeneralBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Producto General -->
    <div class="modal fade" id="genProductModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold text-success" id="genModalTitle">Producto General</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="genProdIndex">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Concepto / Producto</label>
                        <input type="text" class="form-control" id="genConcept" placeholder="Ej. Crema dental" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Área / Categoría</label>
                        <input type="text" class="form-control" id="genArea" placeholder="Ej. Aseo Personal, Cocina..."
                            required>
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label small fw-bold">Precio Unitario ($)</label>
                            <input type="number" class="form-control" id="genPrice" min="0" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label small fw-bold">Cantidad</label>
                            <input type="number" class="form-control" id="genQty" min="1" value="1" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Estado</label>
                        <select class="form-select" id="genStatus">
                            <option value="NO">NO (No se necesita)</option>
                            <option value="SI">SI (Se debe comprar)</option>
                            <option value="YA">YA (Ya se compro)</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary rounded-pill px-4"
                        data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-success rounded-pill px-4"
                        onclick="saveGeneralProduct()">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <button class="back-to-top" id="backToTop" type="button" aria-label="Volver al inicio"
        title="Volver al inicio" hidden>
        <i class="bi bi-arrow-up" aria-hidden="true"></i>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="mercado.js"></script>
</body>

</html>
